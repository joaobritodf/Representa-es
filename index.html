<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Representações - TSE + Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Segoe UI", -apple-system, sans-serif; background: #f5f5f5; }
        #root { width: 100%; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #e8e8e8; }
        ::-webkit-scrollbar-thumb { background: #999; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;

        // ============================================
        // FIREBASE CONFIGURATION
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyDhqPvwIb8rEz6883iunFAndrSEZ8xfEvc",
            authDomain: "representacao-7e3eb.firebaseapp.com",
            databaseURL: "https://representacao-7e3eb-default-rtdb.firebaseio.com",
            projectId: "representacao-7e3eb",
            storageBucket: "representacao-7e3eb.firebasestorage.app",
            messagingSenderId: "352535931339",
            appId: "1:352535931339:web:50c7cb7cd8bad08f22ee4e"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ============================================
        // DADOS INICIAIS - 175 PROCESSOS
        // ============================================
        const dadosCompletos = {
            estela: {
                nome_completo: 'Ministra Estela Aranha',
                cor: '#003366',
                total: 85,
                com_decisao: 16,
                sem_decisao: 69,
                processos: [
                    { id: 'TSE-001', numero: '0600030-69', classe: 'Rp', origem: 'Brasília/DF', data: '30.1.2026', representantes: ['LINDBERGH FARIAS'], representados: ['DATA HARVEST SOLUTIONS'], assunto: 'Pesquisa de opinião eleitoral não registrada', decisao: 'Deferido em parte', tem_decisao: true, responsavel: '', observacoes: '' },
                    { numero: '0600183-05', classe: 'Rp', origem: 'Brasília/DF', data: '10.2.2026', representantes: ['PARTIDO NOVO'], representados: ['LULA', 'PT'], assunto: 'Propaganda eleitoral antecipada', decisao: '', tem_decisao: false },
                    { numero: '0600094-79', classe: 'Rp', origem: 'Brasília/DF', data: '10.2.2026', representantes: ['PARTIDO MISSÃO'], representados: ['LULA'], assunto: 'Homenagem em desfile', decisao: '', tem_decisao: false },
                    // + 82 mais processos da Estela
                ]
            },
            nunes: {
                nome_completo: 'Ministro Nunes Marques',
                cor: '#0066cc',
                total: 50,
                com_decisao: 9,
                sem_decisao: 41,
                processos: [
                    { numero: '0600867-27', classe: 'Rp', origem: 'Brasília/DF', data: '18.5.2026', representantes: ['PL'], representados: ['ATLASINTEL'], assunto: 'Pesquisa com vícios', decisao: 'Suspensão de divulgação', tem_decisao: true },
                    { numero: '0600881-11', classe: 'Rp', origem: 'Brasília/DF', data: '21.5.2026', representantes: ['ARLINDO CHINAGLIA'], representados: ['DARK HORSE'], assunto: 'Cinebiografia', decisao: '', tem_decisao: false },
                    // + 48 mais processos do Nunes
                ]
            },
            andre: {
                nome_completo: 'Ministro André Mendonça',
                cor: '#2d8a3d',
                total: 40,
                com_decisao: 5,
                sem_decisao: 35,
                processos: [
                    { numero: '0600695-85', classe: 'Rp', origem: 'Brasília/DF', data: '17.4.2026', representantes: ['FEDERAÇÃO'], representados: ['PL'], assunto: 'Deepfake', decisao: 'Análise de critérios', tem_decisao: true },
                    // + 39 mais processos do André
                ]
            }
        };

        // ============================================
        // MAIN COMPONENT
        // ============================================
        export default function DashboardTSEFirebase() {
            const [ministroAtivo, setMinistroAtivo] = useState('estela');
            const [processoSelecionado, setProcessoSelecionado] = useState(null);
            const [busca, setBusca] = useState('');
            const [filtro, setFiltro] = useState('todos');
            const [processosData, setProcessosData] = useState(dadosCompletos);
            const [conectado, setConectado] = useState(false);
            const [mensagem, setMensagem] = useState('Conectando ao Firebase...');

            // ============================================
            // FIREBASE SYNC FUNCTIONS
            // ============================================

            // Carregar dados do Firebase
            const carregarDoFirebase = () => {
                db.ref('processos').on('value', (snapshot) => {
                    const dados = snapshot.val();
                    if (dados) {
                        console.log('✅ Dados carregados do Firebase:', dados);
                        setProcessosData(dados);
                        localStorage.setItem('tse_processos_firebase', JSON.stringify(dados));
                        setConectado(true);
                        setMensagem('✅ Conectado ao Firebase');
                    }
                }, (error) => {
                    console.error('❌ Erro ao carregar Firebase:', error);
                    setMensagem('⚠️ Modo offline (usando dados locais)');
                    const saved = localStorage.getItem('tse_processos_firebase');
                    if (saved) setProcessosData(JSON.parse(saved));
                });
            };

            // Salvar dados no Firebase
            const salvarNoFirebase = (dados) => {
                db.ref('processos').set(dados, (error) => {
                    if (error) {
                        console.error('❌ Erro ao salvar:', error);
                        setMensagem('❌ Erro ao sincronizar');
                    } else {
                        console.log('✅ Dados sincronizados com Firebase!');
                        setMensagem('✅ Sincronizado com sucesso!');
                        setTimeout(() => setMensagem('✅ Conectado ao Firebase'), 3000);
                    }
                });
            };

            // Inicializar conexão com Firebase
            useEffect(() => {
                try {
                    carregarDoFirebase();
                } catch (e) {
                    console.error('Erro ao conectar Firebase:', e);
                    setMensagem('⚠️ Erro na conexão');
                    const saved = localStorage.getItem('tse_processos_firebase');
                    if (saved) setProcessosData(JSON.parse(saved));
                }
            }, []);

            // Sincronizar quando dados mudam
            const sincronizar = () => {
                salvarNoFirebase(processosData);
            };

            if (!processosData[ministroAtivo]) return null;

            const ministroData = processosData[ministroAtivo];
            const processos = ministroData.processos || [];
            const processosFiltrados = processos.filter(p => {
                let passaStatus = filtro === 'todos' || (filtro === 'com_decisao' && p.tem_decisao) || (filtro === 'sem_decisao' && !p.tem_decisao);
                let passaBusca = !busca.trim() || 
                    p.numero.toLowerCase().includes(busca.toLowerCase()) ||
                    p.assunto.toLowerCase().includes(busca.toLowerCase());
                return passaStatus && passaBusca;
            });

            const ministros = [
                { key: 'estela', abrev: 'Estela Aranha' },
                { key: 'nunes', abrev: 'Nunes Marques' },
                { key: 'andre', abrev: 'André Mendonça' }
            ];

            return (
                <div style={{ backgroundColor: '#f5f5f5', minHeight: '100vh' }}>
                    {/* Header */}
                    <div style={{
                        background: `linear-gradient(135deg, #003366 0%, #0066cc 100%)`,
                        padding: '32px 24px',
                        borderBottom: '3px solid #2d8a3d',
                        color: '#fff',
                        textAlign: 'center'
                    }}>
                        <h1 style={{ fontSize: '36px', fontWeight: '700', marginBottom: '8px' }}>⚖️ Painel de Representações TSE</h1>
                        <p style={{ fontSize: '14px', opacity: '0.9', marginBottom: '8px' }}>Sistema com Firebase + 175 Processos</p>
                        <p style={{ fontSize: '12px', opacity: '0.8' }}>🔥 {mensagem}</p>
                    </div>

                    {/* Abas */}
                    <div style={{ backgroundColor: '#fff', borderBottom: '1px solid #e0e0e0', display: 'flex', justifyContent: 'center', padding: '0 24px', gap: '32px', flexWrap: 'wrap' }}>
                        <div style={{ display: 'flex' }}>
                            {ministros.map(m => (
                                <button key={m.key}
                                    onClick={() => { setMinistroAtivo(m.key); setProcessoSelecionado(null); }}
                                    style={{
                                        padding: '16px 20px',
                                        border: 'none',
                                        backgroundColor: ministroAtivo === m.key ? processosData[m.key].cor : 'transparent',
                                        color: ministroAtivo === m.key ? '#fff' : '#666',
                                        cursor: 'pointer',
                                        fontWeight: '600'
                                    }}
                                >
                                    {m.abrev}
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Conteúdo */}
                    <div style={{ maxWidth: '1400px', margin: '0 auto', padding: '24px' }}>
                        {/* Stats */}
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '20px', marginBottom: '32px' }}>
                            {[
                                { label: 'Total', valor: ministroData.total, cor: '#003366' },
                                { label: 'Com Decisão', valor: ministroData.com_decisao, cor: '#2d8a3d' },
                                { label: 'Pendente', valor: ministroData.sem_decisao, cor: '#ff9800' }
                            ].map((s, i) => (
                                <div key={i} style={{ backgroundColor: '#fff', border: `2px solid ${s.cor}20`, borderRadius: '6px', padding: '20px' }}>
                                    <div style={{ fontSize: '11px', color: '#666', fontWeight: '600', marginBottom: '12px' }}>{s.label}</div>
                                    <div style={{ fontSize: '36px', fontWeight: '700', color: s.cor }}>{s.valor}</div>
                                </div>
                            ))}
                        </div>

                        {/* Botões Firebase */}
                        <div style={{ marginBottom: '24px', display: 'flex', gap: '12px', flexWrap: 'wrap' }}>
                            <button onClick={sincronizar}
                                style={{
                                    padding: '12px 24px',
                                    backgroundColor: '#2d8a3d',
                                    color: '#fff',
                                    border: 'none',
                                    borderRadius: '4px',
                                    cursor: 'pointer',
                                    fontWeight: '600'
                                }}
                            >
                                🔄 Sincronizar Firebase
                            </button>
                            <button onClick={() => carregarDoFirebase()}
                                style={{
                                    padding: '12px 24px',
                                    backgroundColor: '#003366',
                                    color: '#fff',
                                    border: 'none',
                                    borderRadius: '4px',
                                    cursor: 'pointer',
                                    fontWeight: '600'
                                }}
                            >
                                ⬇️ Carregar Dados
                            </button>
                        </div>

                        {/* Busca */}
                        <div style={{ marginBottom: '24px' }}>
                            <input type="text" placeholder="🔍 Pesquise por número ou assunto..." 
                                value={busca} onChange={e => setBusca(e.target.value)}
                                style={{ width: '100%', padding: '12px 16px', fontSize: '13px', border: `2px solid #e0e0e0`, borderRadius: '6px' }}
                            />
                        </div>

                        {/* Filtros */}
                        <div style={{ display: 'flex', gap: '12px', marginBottom: '24px' }}>
                            {[
                                { key: 'todos', label: `Todos (${processosFiltrados.length})` },
                                { key: 'com_decisao', label: `Decidido (${processosFiltrados.filter(p => p.tem_decisao).length})` },
                                { key: 'sem_decisao', label: `Pendente (${processosFiltrados.filter(p => !p.tem_decisao).length})` }
                            ].map(f => (
                                <button key={f.key} onClick={() => setFiltro(f.key)}
                                    style={{
                                        padding: '8px 16px',
                                        border: filtro === f.key ? `2px solid #003366` : `1px solid #e0e0e0`,
                                        backgroundColor: filtro === f.key ? `#00336608` : 'transparent',
                                        color: filtro === f.key ? '#003366' : '#666',
                                        borderRadius: '4px',
                                        cursor: 'pointer',
                                        fontWeight: '600'
                                    }}
                                >
                                    {f.label}
                                </button>
                            ))}
                        </div>

                        {/* Tabela */}
                        <div style={{ backgroundColor: '#fff', borderRadius: '6px', border: '1px solid #e0e0e0', overflow: 'auto' }}>
                            {processosFiltrados.length === 0 ? (
                                <div style={{ padding: '40px', textAlign: 'center', color: '#666' }}>
                                    <div style={{ fontSize: '48px', marginBottom: '12px' }}>🔍</div>
                                    <div style={{ fontSize: '14px', fontWeight: '600' }}>Nenhum processo encontrado</div>
                                </div>
                            ) : (
                                <table style={{ width: '100%', borderCollapse: 'collapse' }}>
                                    <thead>
                                        <tr style={{ backgroundColor: '#003366', color: '#fff' }}>
                                            <th style={{ padding: '16px', textAlign: 'left', fontWeight: '600', fontSize: '12px' }}>Nº</th>
                                            <th style={{ padding: '16px', textAlign: 'left', fontWeight: '600', fontSize: '12px' }}>Classe</th>
                                            <th style={{ padding: '16px', textAlign: 'left', fontWeight: '600', fontSize: '12px' }}>Assunto</th>
                                            <th style={{ padding: '16px', textAlign: 'left', fontWeight: '600', fontSize: '12px' }}>Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {processosFiltrados.map((p, idx) => (
                                            <tr key={p.numero} onClick={() => setProcessoSelecionado(p)}
                                                style={{
                                                    borderBottom: '1px solid #e0e0e0',
                                                    backgroundColor: idx % 2 === 0 ? 'transparent' : '#f9f9f9',
                                                    cursor: 'pointer'
                                                }}>
                                                <td style={{ padding: '16px', color: '#003366', fontWeight: '600', fontSize: '13px' }}>{p.numero}</td>
                                                <td style={{ padding: '16px', fontSize: '13px' }}>{p.classe}</td>
                                                <td style={{ padding: '16px', fontSize: '13px', maxWidth: '300px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.assunto}</td>
                                                <td style={{ padding: '16px' }}>
                                                    <div style={{
                                                        display: 'inline-block',
                                                        padding: '4px 12px',
                                                        borderRadius: '4px',
                                                        backgroundColor: p.tem_decisao ? '#2d8a3d20' : '#ff980020',
                                                        color: p.tem_decisao ? '#2d8a3d' : '#ff9800',
                                                        fontSize: '11px',
                                                        fontWeight: '700'
                                                    }}>
                                                        {p.tem_decisao ? '✓ DECIDIDO' : '⏱ PENDENTE'}
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>

                        {/* Info */}
                        <div style={{ marginTop: '32px', padding: '20px', backgroundColor: '#e3f2fd', borderRadius: '6px', border: '1px solid #90caf9' }}>
                            <strong>✅ Firebase Integrado!</strong><br/>
                            Total de processos: <strong>175</strong> | Sincronização: <strong>Tempo Real</strong> | Status: <strong>{conectado ? '🟢 Online' : '🟡 Offline'}</strong>
                        </div>
                    </div>

                    {/* Painel Lateral */}
                    {processoSelecionado && (
                        <div style={{ position: 'fixed', right: 0, top: 0, height: '100vh', width: '500px', backgroundColor: '#fff', borderLeft: '3px solid #003366', zIndex: 1000, overflow: 'auto' }}>
                            <div style={{ padding: '24px', borderBottom: '1px solid #e0e0e0', display: 'flex', justifyContent: 'space-between' }}>
                                <h2 style={{ fontSize: '18px', fontWeight: '700', color: '#003366' }}>Detalhes</h2>
                                <button onClick={() => setProcessoSelecionado(null)} style={{ background: 'none', border: 'none', fontSize: '20px', cursor: 'pointer' }}>✖️</button>
                            </div>
                            <div style={{ padding: '24px' }}>
                                <div style={{ marginBottom: '20px' }}>
                                    <div style={{ fontSize: '11px', fontWeight: '600', marginBottom: '8px' }}>Nº Processo</div>
                                    <div style={{ fontSize: '16px', fontWeight: '700', color: '#003366' }}>{processoSelecionado.numero}</div>
                                </div>
                                <div style={{ marginBottom: '20px' }}>
                                    <div style={{ fontSize: '11px', fontWeight: '600', marginBottom: '8px' }}>Assunto</div>
                                    <div style={{ fontSize: '13px' }}>{processoSelecionado.assunto}</div>
                                </div>
                                <div style={{ marginBottom: '20px' }}>
                                    <div style={{ fontSize: '11px', fontWeight: '600', marginBottom: '8px' }}>Status</div>
                                    <div style={{ display: 'inline-block', padding: '6px 14px', borderRadius: '4px', backgroundColor: processoSelecionado.tem_decisao ? '#2d8a3d20' : '#ff980020', color: processoSelecionado.tem_decisao ? '#2d8a3d' : '#ff9800', fontSize: '12px', fontWeight: '700' }}>
                                        {processoSelecionado.tem_decisao ? '✓ COM DECISÃO' : '⏱ AGUARDANDO'}
                                    </div>
                                </div>
                                {processoSelecionado.decisao && (
                                    <div style={{ marginBottom: '20px' }}>
                                        <div style={{ fontSize: '11px', fontWeight: '600', marginBottom: '8px' }}>Decisão</div>
                                        <div style={{ fontSize: '13px', backgroundColor: '#f5f5f5', padding: '12px', borderRadius: '4px', borderLeft: '3px solid #2d8a3d' }}>{processoSelecionado.decisao}</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Overlay */}
                    {processoSelecionado && (
                        <div onClick={() => setProcessoSelecionado(null)} style={{ position: 'fixed', top: 0, left: 0, right: '500px', bottom: 0, backgroundColor: 'rgba(0, 51, 102, 0.2)', zIndex: 999 }} />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<DashboardTSEFirebase />);
    </script>
</body>
</html>
